<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
tailwind.config = {
  darkMode:"class",
  theme:{extend:{
    colors:{"primary-container":"#0070eb","primary":"#0058bc","outline-variant":"#c1c6d7","on-primary":"#ffffff","secondary":"#5e5e5e","on-surface":"#1c1b1b","surface":"#fcf9f8","outline":"#717786"},
    borderRadius:{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},
    spacing:{"sm":"8px","md":"16px","container-max":"1280px","lg":"24px","xl":"48px","gutter":"20px"},
    fontFamily:{"body-md":["Space Grotesk"],"display":["Space Grotesk"],"code-md":["JetBrains Mono"]},
    fontSize:{"body-md":["16px",{"lineHeight":"1.6"}],"h2":["24px",{"lineHeight":"1.3","fontWeight":"600"}],"display":["48px",{"lineHeight":"1.1","fontWeight":"700"}]}
  }}
}
</script>
<style>
body{background-color:#fcf9f8;margin:0;padding:0;}
body.dark-preview{background:#171717;color:#f5f5f5;}
.dark-preview .card,.dark-preview .side-nav{background:#222;border-color:#404040;}
.dark-preview .page-title,.dark-preview .setting-name{color:#f5f5f5;}
.dark-preview .setting-help,.dark-preview .card-title{color:#a3a3a3;}
.dark-preview .form-input,.dark-preview .select-input{background:#171717;border-color:#525252;color:#f5f5f5;}
.dark-preview .setting-row{border-color:#3f3f3f;}
.dark-preview .toggle span{background:#525252;}
.page-wrap{max-width:1120px;margin:2rem auto;padding:0 20px;}
.page-title{font-size:1.4rem;font-weight:700;margin-bottom:1.2rem;font-family:'Space Grotesk',sans-serif;}
.settings-grid{max-width:860px;}
.card{background:#fff;border:1px solid #c1c6d7;border-radius:8px;padding:1.5rem;margin-bottom:1rem;}
.card-title{font-size:12px;color:#717786;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-bottom:1rem;}
.setting-row{display:grid;grid-template-columns:1fr 260px;gap:1rem;align-items:center;padding:0.85rem 0;border-bottom:1px solid #e5e2e1;}
.setting-row:last-child{border-bottom:none;padding-bottom:0;}
.setting-name{font-size:0.95rem;font-weight:700;color:#1c1b1b;margin-bottom:0.15rem;}
.setting-help{font-size:0.8rem;color:#717786;line-height:1.45;}
.form-input,.select-input{background:#fcf9f8;border:1px solid #c1c6d7;color:#1c1b1b;padding:8px 12px;border-radius:8px;width:100%;font-size:0.85rem;outline:none;}
.form-input:focus,.select-input:focus{border-color:#0058bc;}
.toggle-row{display:flex;justify-content:flex-end;}
.toggle{position:relative;width:46px;height:26px;display:inline-block;}
.toggle input{opacity:0;width:0;height:0;}
.toggle span{position:absolute;cursor:pointer;inset:0;background:#c1c6d7;border-radius:999px;transition:0.2s;}
.toggle span:before{content:"";position:absolute;height:20px;width:20px;left:3px;top:3px;background:white;border-radius:50%;transition:0.2s;box-shadow:0 1px 4px rgba(28,27,27,0.2);}
.toggle input:checked + span{background:#0058bc;}
.toggle input:checked + span:before{transform:translateX(20px);}
.actions{display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;}
@media (max-width: 800px){
  .setting-row{grid-template-columns:1fr;}
  .toggle-row{justify-content:flex-start;}
}
</style>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<main class="page-wrap">
  <div class="page-title">설정</div>

  <div class="settings-grid">
    <section>
      <div class="card" id="account">
        <div class="card-title">계정</div>
        <div class="setting-row">
          <div>
            <div class="setting-name">닉네임</div>
            <div class="setting-help">경기 화면과 온라인 사용자 목록에 표시됩니다.</div>
          </div>
          <input class="form-input" type="text" value="철몽"/>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-name">비밀번호</div>
            <div class="setting-help">새 비밀번호로 변경합니다.</div>
          </div>
          <input class="form-input" type="password" placeholder="새 비밀번호"/>
        </div>
      </div>

      <div class="card" id="battle">
        <div class="card-title">배틀</div>
        <div class="setting-row">
          <div>
            <div class="setting-name">기본 언어</div>
            <div class="setting-help">배틀 입장 시 에디터에 먼저 선택될 언어입니다.</div>
          </div>
          <select class="select-input">
            <option>Python</option>
            <option>Java</option>
            <option>C++</option>
          </select>
        </div>
      </div>

      <div class="card" id="editor">
        <div class="card-title">에디터</div>
        <div class="setting-row">
          <div>
            <div class="setting-name">글자 크기</div>
            <div class="setting-help">코드 에디터의 기본 글자 크기입니다.</div>
          </div>
          <select class="select-input">
            <option>14px</option>
            <option selected>16px</option>
            <option>18px</option>
            <option>20px</option>
          </select>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-name">탭 크기</div>
            <div class="setting-help">Tab 입력 시 적용되는 공백 너비입니다.</div>
          </div>
          <select class="select-input">
            <option>2 spaces</option>
            <option selected>4 spaces</option>
          </select>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-name">자동 줄바꿈</div>
            <div class="setting-help">긴 코드를 화면 너비에 맞춰 줄바꿈합니다.</div>
          </div>
          <div class="toggle-row">
            <label class="toggle"><input id="darkModeToggle" type="checkbox"/><span></span></label>
          </div>
        </div>
      </div>

      <div class="card" id="display">
        <div class="card-title">화면</div>
        <div class="setting-row">
          <div>
            <div class="setting-name">다크 모드</div>
            <div class="setting-help">어두운 화면 테마를 사용합니다.</div>
          </div>
          <div class="toggle-row">
            <label class="toggle"><input type="checkbox"/><span></span></label>
          </div>
        </div>
        <div class="actions">
          <button class="px-md py-sm border border-outline-variant text-secondary rounded-lg text-sm hover:border-primary hover:text-primary transition-all">취소</button>
          <button class="px-md py-sm bg-primary text-on-primary rounded-lg font-bold text-sm hover:bg-primary-container transition-all">저장</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
const darkModeToggle = document.getElementById('darkModeToggle');
darkModeToggle.addEventListener('change', () => {
  document.body.classList.toggle('dark-preview', darkModeToggle.checked);
});

fetch('/components/user-navbar.html?v=' + Date.now(), { cache: 'no-store' })
  .then(response => response.text())
  .then(html => {
    document.getElementById('navbar-container').innerHTML = html;
  })
  .catch(() => {
    console.warn('user-navbar.html을 불러오지 못했습니다.');
  });
</script>
</body>
</html>
