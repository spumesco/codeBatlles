<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/ranking-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/ranking.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<main class="ranking-page max-w-[1280px] mx-auto px-5 py-10">
  <div class="ranking-heading mb-8">
    <h1 class="font-h1 text-h1 text-on-surface mb-1">랭킹</h1>
    <p class="font-body-sm text-body-sm text-secondary">승리 수와 승률을 기준으로 현재 사용자 순위를 확인합니다.</p>
  </div>

  <section class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    <div class="stat-card">
      <p class="font-label-md text-label-md text-secondary uppercase mb-2">전체 사용자</p>
      <p id="stat-users" class="font-display text-h1 text-on-surface">0</p>
    </div>
    <div class="stat-card">
      <p class="font-label-md text-label-md text-secondary uppercase mb-2">총 경기 수</p>
      <p id="stat-battles" class="font-display text-h1 text-primary">0</p>
    </div>
    <div class="stat-card">
      <p class="font-label-md text-label-md text-secondary uppercase mb-2">최고 승률</p>
      <p id="stat-rate" class="font-display text-h1 text-on-surface">0%</p>
    </div>
    <div class="stat-card">
      <p class="font-label-md text-label-md text-secondary uppercase mb-2">내 순위</p>
      <p class="font-display text-h1 text-primary">#42</p>
    </div>
  </section>

  <section class="stat-card mb-6">
    <div class="flex flex-col md:flex-row md:items-center gap-3">
      <div class="relative flex-1">
        <span class="material-symbols-outlined search-icon absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
        <input id="search-input" class="filter-input w-full pl-9" type="text" placeholder="닉네임 또는 ID 검색"/>
      </div>
      <select id="sort-select" class="filter-input">
        <option value="wins">승리 수 기준</option>
        <option value="rate">승률 기준</option>
        <option value="battles">경기 수 기준</option>
      </select>
    </div>
  </section>

  <section class="table-wrap">
    <table class="w-full">
      <thead>
        <tr class="ranking-table-head border-b border-outline-variant">
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">순위</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">닉네임</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">ID</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">승리</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">패배</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">승률</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase">총 경기</th>
        </tr>
      </thead>
      <tbody id="ranking-tbody"></tbody>
    </table>
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-secondary">
      <span class="material-symbols-outlined empty-icon mb-3">leaderboard</span>
      <p class="font-body-md text-body-md">검색 결과가 없습니다.</p>
    </div>
  </section>
</main>

<script src="/js/config.js?v=global-dark-3"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js?v=admin-navbar-3"></script>
<script src="/js/ranking.js?v=ranking-dark-1"></script>
</body>
</html>
