<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/matching-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="/css/matching.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<div class="matching-wrap">
  <div class="spinner"></div>
  <h2 id="wait-title" class="match-title">
    매칭 검색 중<span class="dots"><span></span><span></span><span></span></span>
  </h2>
  <p id="wait-description" class="match-sub">현재 접속 중인 사용자와 연결하고 있어요.</p>

  <div class="timer-box">
    <div id="timer-label" class="timer-label">대기 시간</div>
    <div id="timer" class="timer-value">00:00</div>
  </div>

  <a id="cancel-link" href="/main" class="match-cancel-button px-md py-sm bg-primary text-on-primary rounded-lg font-body-md font-bold hover:bg-primary-container transition-all">
    매칭 취소
  </a>
</div>

<script src="/js/config.js?v=global-dark-3"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js?v=admin-navbar-3"></script>
<script src="/js/lobby.js?v=lobby-2"></script>
<script src="/js/matching.js?v=matching-2"></script>
</body>
</html>
