<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/main-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/main.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<div class="page-grid">
  <!-- LEFT: 내 정보 -->
  <div>
    <div class="card">
      <div class="card-title">내 정보</div>
      <div class="info-row"><span class="info-label">닉네임</span><span id="me-nickname" class="info-value">불러오는 중</span></div>
      <div class="info-row"><span class="info-label">ID</span><span id="me-user-id" class="info-value text-muted-mono">불러오는 중</span></div>
      <div class="info-row"><span class="info-label">전적</span><span id="me-record" class="info-value"><span class="text-win">0승</span> <span class="text-lose">0패</span></span></div>
      <div class="info-row"><span class="info-label">상태</span><span id="me-status" class="status-online">● 대기 중</span></div>
      <div class="info-row"><span class="info-label">랭킹</span><span id="me-ranking" class="info-value text-ranking">-</span></div>
    </div>
    <div class="card">
      <div class="card-title">최근 배틀 요청</div>
      <div id="request-list"></div>
      <p id="request-empty" class="request-empty">새로운 요청이 없습니다.</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div>
    <div class="card">
      <div class="card-title">배틀 시작</div>
      <div class="match-grid">
        <div class="match-box">
          <h6>자동 매칭</h6>
          <p>현재 접속 중인 사용자와 자동으로 매칭됩니다.</p>
          <a href="/matching" class="block w-full px-md py-sm bg-primary text-on-primary rounded-lg font-bold text-sm text-center hover:bg-primary-container transition-all match-start-link">자동 매칭 시작</a>
          <button class="w-full px-md py-sm border border-outline-variant text-secondary rounded-lg text-sm hover:border-primary hover:text-primary transition-all">매칭 취소</button>
        </div>
        <div class="match-box">
          <h6>특정 사용자와 배틀</h6>
          <p>상대방 닉네임을 입력하고 배틀을 신청하세요.</p>
          <input id="opponent-nickname" class="input-nick" type="text" placeholder="상대 닉네임 입력"/>
          <button id="btn-request-battle" class="w-full px-md py-sm bg-primary text-on-primary rounded-lg font-bold text-sm hover:bg-primary-container transition-all">배틀 신청</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">온라인 사용자 목록</div>
      <table>
        <thead><tr><th>닉네임</th><th>ID</th><th>상태</th><th>관리</th></tr></thead>
        <tbody id="online-users-tbody">
          <tr><td colspan="4" class="text-center text-secondary py-4">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="/js/config.js?v=main-profile-1"></script>
<script src="/js/api.js?v=main-profile-1"></script>
<script src="/js/navbar.js?v=logout-home-2"></script>
<script src="/js/main.js?v=main-profile-2"></script>
</body>
</html>
