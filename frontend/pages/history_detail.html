<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/history-detail-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/history-detail.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<main class="max-w-[860px] mx-auto px-5 py-10">
  <button id="btn-back" type="button" class="back-button flex items-center gap-1 text-secondary hover:text-primary transition-colors mb-6 font-body-sm text-body-sm font-medium">
    <span class="material-symbols-outlined back-icon">arrow_back</span>
    기록으로 돌아가기
  </button>

  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="font-h1 text-h1 text-on-surface mb-1">경기 상세</h1>
      <p class="font-body-sm text-body-sm text-secondary">배틀 진행 내역을 확인하세요.</p>
    </div>
    <span id="result-badge" class="inline-block px-4 py-2 rounded-full text-sm font-bold">-</span>
  </div>

  <div class="detail-card bg-surface-container-lowest border border-outline-variant rounded-xl px-6 py-2 mb-6">
    <div class="info-row">
      <span class="info-label">문제</span>
      <span id="detail-problem" class="info-value">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">상대</span>
      <span id="detail-opponent" class="info-value font-code-md">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">시작</span>
      <span id="detail-start" class="info-value">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">종료</span>
      <span id="detail-end" class="info-value">-</span>
    </div>
    <div class="info-row">
      <span class="info-label">소요 시간</span>
      <span id="detail-time" class="info-value font-code-md text-primary font-bold">-</span>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="submission-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5">
      <h2 class="font-h3 text-h3 text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined card-icon text-primary">person</span>
        내 제출
      </h2>
      <div id="my-submissions"></div>
    </div>

    <div class="submission-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5">
      <h2 class="font-h3 text-h3 text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined card-icon text-secondary">person_outline</span>
        상대 제출
      </h2>
      <div id="opp-submissions"></div>
    </div>
  </div>
</main>

<script src="/js/config.js?v=global-dark-3"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js?v=admin-navbar-3"></script>
<script src="/js/history-detail.js"></script>
</body>
</html>
