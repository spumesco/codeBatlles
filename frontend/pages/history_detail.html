<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "surface-dim": "#dcd9d9",
          "primary-container": "#0070eb",
          "primary": "#0058bc",
          "outline-variant": "#c1c6d7",
          "error": "#ba1a1a",
          "secondary": "#5e5e5e",
          "inverse-primary": "#adc6ff",
          "on-surface-variant": "#414755",
          "on-primary": "#ffffff",
          "tertiary": "#4648d4",
          "surface": "#fcf9f8",
          "on-surface": "#1c1b1b",
          "surface-container-low": "#f6f3f2",
          "surface-container-lowest": "#ffffff",
          "primary-fixed": "#d8e2ff",
          "on-secondary": "#ffffff",
          "outline": "#717786",
          "background": "#fcf9f8",
          "surface-container": "#f0edec",
          "surface-container-high": "#ebe7e7"
        },
        "borderRadius": {
          "DEFAULT": "0.125rem", "lg": "0.25rem",
          "xl": "0.5rem", "full": "0.75rem"
        },
        "spacing": {
          "base": "4px", "sm": "8px", "md": "16px",
          "container-max": "1280px", "lg": "24px",
          "xl": "48px", "xs": "4px", "gutter": "20px"
        },
        "fontFamily": {
          "code-md": ["JetBrains Mono"],
          "body-sm": ["Space Grotesk"], "body-md": ["Space Grotesk"],
          "h1": ["Space Grotesk"], "h2": ["Space Grotesk"],
          "display": ["Space Grotesk"], "body-lg": ["Space Grotesk"],
          "label-md": ["Space Grotesk"], "h3": ["Space Grotesk"]
        },
        "fontSize": {
          "code-md": ["14px", {"lineHeight": "1.7", "fontWeight": "400"}],
          "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
          "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "h1": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700"}],
          "h2": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
          "display": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
          "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
          "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}],
          "h3": ["20px", {"lineHeight": "1.4", "fontWeight": "600"}]
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  body { background-color: #fcf9f8; margin: 0; padding: 0; }

  .nav-divider {
    width: 1px; height: 20px;
    background-color: #c1c6d7;
    display: inline-block; vertical-align: middle; margin: 0 4px;
  }

  .badge-win  { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
  .badge-lose { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

  /* 제출 결과 배지 */
  .verdict-ac   { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
  .verdict-wa   { background: #fff7ed; color: #9a3412; border: 1px solid #fdba74; }
  .verdict-re   { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  .verdict-tle  { background: #ede9fe; color: #5b21b6; border: 1px solid #c4b5fd; }
  .verdict-etc  { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

  .submit-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; border-radius: 0.5rem;
    border: 1px solid #e5e2e1; background: #fff;
    margin-bottom: 8px; transition: background 0.12s;
  }
  .submit-row:hover { background: #f6f3f2; }

  .info-row {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #e5e2e1;
  }
  .info-row:last-child { border-bottom: none; }
  .info-label {
    width: 120px; flex-shrink: 0;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase;
    color: #5e5e5e; font-family: 'Space Grotesk', sans-serif;
  }
  .info-value {
    font-size: 15px; color: #1c1b1b;
    font-family: 'Space Grotesk', sans-serif; font-weight: 500;
  }
</style>
</head>
<body class="bg-surface font-body-md text-on-surface">

<!-- 네비게이션 바 -->
<div id="navbar-container"></div>

<main class="max-w-[860px] mx-auto px-5 py-10">

  <!-- 뒤로가기 -->
  <button id="btn-back"
    class="flex items-center gap-1 text-secondary hover:text-primary transition-colors mb-6 font-body-sm text-body-sm font-medium">
    <span class="material-symbols-outlined" style="font-size:18px;">arrow_back</span>
    기록으로 돌아가기
  </button>

  <!-- 페이지 타이틀 -->
  <div class="flex items-center justify-between mb-8">
    <div>
      <h1 class="font-h1 text-h1 text-on-surface mb-1">경기 상세</h1>
      <p class="font-body-sm text-body-sm text-secondary">배틀 진행 내역을 확인하세요.</p>
    </div>
    <span id="result-badge" class="inline-block px-4 py-2 rounded-full text-sm font-bold">—</span>
  </div>

  <!-- ── 경기 정보 ── -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl px-6 py-2 mb-6">
    <div class="info-row">
      <span class="info-label">문제</span>
      <span id="detail-problem" class="info-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">상대</span>
      <span id="detail-opponent" class="info-value font-code-md">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">시작</span>
      <span id="detail-start" class="info-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">종료</span>
      <span id="detail-end" class="info-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">소요 시간</span>
      <span id="detail-time" class="info-value font-code-md text-primary font-bold">—</span>
    </div>
  </div>

  <!-- ── 제출 내역 ── -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- 내 제출 -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5">
      <h2 class="font-h3 text-h3 text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-primary" style="font-size:20px;">person</span>
        내 제출
      </h2>
      <div id="my-submissions">—</div>
    </div>

    <!-- 상대 제출 -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-5">
      <h2 class="font-h3 text-h3 text-on-surface mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-secondary" style="font-size:20px;">person_outline</span>
        상대 제출
      </h2>
      <div id="opp-submissions">—</div>
    </div>

  </div>

</main>

<script>
  // ── 네비게이션 바 로드 ──
  fetch('../components/navbar.html')
    .then(res => res.text())
    .then(html => { document.getElementById('navbar-container').innerHTML = html; });

  // ── 뒤로가기 ──
  document.getElementById('btn-back').addEventListener('click', () => {
    history.back();
  });

  // ── 더미 상세 데이터 (실제 구현 시 백엔드 API로 대체) ──
  const DETAIL_DATA = {
    '두 수의 합_devKing_2025-05-18': {
      problem: '두 수의 합', result: 'win', opponent: 'devKing',
      start: '2025-05-18 21:10', end: '2025-05-18 21:14', time: '04:32',
      mySubmits:  [
        { lang: 'Python', verdict: 'Wrong Answer',   at: '21:11' },
        { lang: 'Python', verdict: 'Accepted',        at: '21:14' },
      ],
      oppSubmits: [
        { lang: 'Java',   verdict: 'Wrong Answer',   at: '21:12' },
        { lang: 'Java',   verdict: 'Wrong Answer',   at: '21:13' },
      ],
    },
    '팰린드롬_codeWolf_2025-05-17': {
      problem: '팰린드롬', result: 'lose', opponent: 'codeWolf',
      start: '2025-05-17 19:00', end: '2025-05-17 19:07', time: '07:11',
      mySubmits:  [
        { lang: 'Python', verdict: 'Wrong Answer',   at: '19:02' },
        { lang: 'Python', verdict: 'Runtime Error',  at: '19:04' },
        { lang: 'Python', verdict: 'Wrong Answer',   at: '19:06' },
        { lang: 'Python', verdict: 'Wrong Answer',   at: '19:07' },
      ],
      oppSubmits: [
        { lang: 'C++',    verdict: 'Wrong Answer',   at: '19:03' },
        { lang: 'C++',    verdict: 'Accepted',        at: '19:06' },
      ],
    },
  };

  // ── verdict → CSS 클래스 ──
  function verdictClass(v) {
    if (v === 'Accepted')       return 'verdict-ac';
    if (v === 'Wrong Answer')   return 'verdict-wa';
    if (v === 'Runtime Error')  return 'verdict-re';
    if (v === 'Time Limit')     return 'verdict-tle';
    return 'verdict-etc';
  }

  // ── 제출 목록 HTML 생성 ──
  function renderSubmits(list) {
    if (!list || list.length === 0) return '<p class="text-secondary text-sm">제출 기록 없음</p>';
    return list.map((s, i) => `
      <div class="submit-row">
        <span class="font-body-sm text-body-sm text-secondary" style="width:20px;">${i + 1}</span>
        <span class="font-code-md text-body-sm text-on-surface-variant" style="width:54px;">${s.lang}</span>
        <span class="inline-block px-2 py-0.5 rounded text-xs font-bold ${verdictClass(s.verdict)}">${s.verdict}</span>
        <span class="ml-auto font-code-md text-body-sm text-secondary">${s.at}</span>
      </div>
    `).join('');
  }

  // ── URL 파라미터 파싱 ──
  const params  = new URLSearchParams(window.location.search);
  const key     = params.get('key');   // history.html에서 넘겨주는 키
  const data    = DETAIL_DATA[key];

  if (data) {
    const isWin = data.result === 'win';
    const badge = document.getElementById('result-badge');
    badge.textContent = isWin ? '승리' : '패배';
    badge.className   = `inline-block px-4 py-2 rounded-full text-sm font-bold ${isWin ? 'badge-win' : 'badge-lose'}`;

    document.getElementById('detail-problem').textContent  = data.problem;
    document.getElementById('detail-opponent').textContent = data.opponent || '(알 수 없음)';
    document.getElementById('detail-start').textContent    = data.start;
    document.getElementById('detail-end').textContent      = data.end;
    document.getElementById('detail-time').textContent     = data.time;

    document.getElementById('my-submissions').innerHTML  = renderSubmits(data.mySubmits);
    document.getElementById('opp-submissions').innerHTML = renderSubmits(data.oppSubmits);
  } else {
    // 데이터 없는 경우
    const fallback = {
      problem: ' ', result: ' ', opponent: ' ',
      start: ' ', end: ' ', time: ' ',
      mySubmits: [
        { lang: ' ', verdict: ' ',  at: ' ' },
      ],
      oppSubmits: [
        { lang: ' ', verdict: ' ', at: ' ' },
      ],
    };

    const isWin = fallback.result === 'win';
    const badge = document.getElementById('result-badge');
    badge.textContent = isWin ? '승리' : '패배';
    badge.className   = `inline-block px-4 py-2 rounded-full text-sm font-bold ${isWin ? 'badge-win' : 'badge-lose'}`;

    document.getElementById('detail-problem').textContent  = fallback.problem;
    document.getElementById('detail-opponent').textContent = fallback.opponent || '(알 수 없음)';
    document.getElementById('detail-start').textContent    = fallback.start;
    document.getElementById('detail-end').textContent      = fallback.end;
    document.getElementById('detail-time').textContent     = fallback.time;

    document.getElementById('my-submissions').innerHTML  = renderSubmits(fallback.mySubmits);
    document.getElementById('opp-submissions').innerHTML = renderSubmits(fallback.oppSubmits);
  }
</script>

</body>
</html>
