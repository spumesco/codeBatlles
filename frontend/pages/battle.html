<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/battle-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="/css/battle.css" rel="stylesheet"/>
</head>
<body>

<div id="navbar-container"></div>

<!--
  카운트다운 모달.
  초기엔 .hidden 으로 숨겨두고, 서버의 첫 'countdown' WebSocket 메시지가
  도착했을 때 battle.js 의 updateCountdown 이 .hidden 을 제거하며 등장시킨다.
  → 페이지 진입 시 하드코딩된 숫자가 깜빡 보였다가 정정되는 버그 방지.
-->
<div class="countdown-backdrop hidden" id="countdownModal" role="dialog" aria-modal="true" aria-labelledby="countdownLabel">
  <div class="countdown-modal">
    <div class="countdown-label" id="countdownLabel">배틀 시작까지</div>
    <div class="countdown-number" id="countdownNumber"></div>
  </div>
</div>

<div class="main-area">
  <div class="drawer" id="drawer">
    <div class="drawer-inner">
      <button id="drawerCloseButton" type="button" class="drawer-close-button px-md py-sm border border-outline-variant text-secondary rounded-lg text-sm hover:text-red-500 transition-all">문제 닫기</button>
      <div class="problem-eyebrow">배틀 문제</div>
      <div id="problemTitle" class="problem-title">A+B</div>
      <div class="problem-meta">
        <div class="meta-item">
          <div class="meta-label">난이도</div>
          <div class="meta-value" id="problemDifficulty">easy</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">시간 제한</div>
          <div class="meta-value"><span id="problemTimeLimit">2</span>s</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">메모리 제한</div>
          <div class="meta-value"><span id="problemMemoryLimit">128</span>MB</div>
        </div>
      </div>
      <div class="section-label">문제 설명</div>
      <div class="section-body" id="problemDescription">두 정수 A와 B를 입력받아 A+B를 출력하세요.</div>
      <div class="section-label">입력</div>
      <div class="section-body" id="problemInputDescription">첫째 줄에 두 정수 A와 B가 공백으로 구분되어 주어진다.</div>
      <div class="section-label">출력</div>
      <div class="section-body" id="problemOutputDescription">첫째 줄에 A+B를 출력한다.</div>
      <div class="section-label">예제 입력</div>
      <div class="code-example" id="problemSampleInput">1 2</div>
      <div class="section-label">예제 출력</div>
      <div class="code-example" id="problemSampleOutput">3</div>
    </div>
  </div>

  <div class="editors">
    <div class="editor-pane">
      <div class="editor-header">
        <span class="editor-header-title">상대방 코드 읽기 전용</span>
        <span class="editor-status">상대방 상태: <strong>작성 중</strong></span>
      </div>
      <div class="editor-body opponent-code">
        <span class="code-muted"># 상대방이 작성 중입니다...</span><br/><br/>
        <span class="code-keyword">print</span>(<span class="code-string">"상대 코드"</span>)
      </div>
      <div class="editor-footer">
        <span class="footer-language">Python</span>
        <span class="footer-center">읽기 전용</span>
        <span class="footer-action"></span>
      </div>
    </div>

    <div class="editor-pane">
      <div class="editor-header">
        <span class="editor-header-title">내 코드</span>
      </div>
      <textarea id="myCodeEditor" class="editor-body" placeholder="여기에 코드를 작성하세요...">a, b = map(int, input().split())
print(a + b)</textarea>
      <div class="editor-footer">
        <select id="languageSelect" class="lang-select">
          <option>Python</option>
          <option>Java</option>
          <option>C++</option>
        </select>
        <span id="judgeResult" class="footer-center judge-result">채점 결과: -</span>
        <button id="submitCodeButton" type="button" class="footer-action submit-button px-md py-sm bg-primary text-on-primary rounded-lg font-bold text-sm hover:bg-primary-container transition-all">제출</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/config.js?v=global-dark-3"></script>
<script src="/js/api.js"></script>
<script src="/js/editor.js?v=editor-1"></script>
<script src="/js/battle.js?v=battle-4"></script>
</body>
</html>
