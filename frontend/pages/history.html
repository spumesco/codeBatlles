<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/history-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="/css/history.css?v=20260523-2" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<div id="history-detail-backdrop" class="history-detail-backdrop" aria-hidden="true" hidden></div>
<aside id="history-detail-drawer" class="history-detail-drawer" aria-hidden="true" hidden>
  <div class="history-drawer-header">
    <div>
      <p id="drawer-battle-id" class="history-drawer-kicker">경기 상세</p>
      <h2 id="drawer-problem" class="history-drawer-title">-</h2>
    </div>
    <button id="drawer-close" type="button" class="history-drawer-close" aria-label="상세 닫기">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <span id="drawer-result-badge" class="inline-block px-4 py-2 rounded-full text-sm font-bold badge-empty">-</span>

  <div class="history-drawer-info">
    <div class="history-drawer-info-row">
      <span>상대</span>
      <strong id="drawer-opponent">-</strong>
    </div>
    <div class="history-drawer-info-row">
      <span>시작</span>
      <strong id="drawer-start">-</strong>
    </div>
    <div class="history-drawer-info-row">
      <span>종료</span>
      <strong id="drawer-end">-</strong>
    </div>
    <div class="history-drawer-info-row">
      <span>소요 시간</span>
      <strong id="drawer-time" class="text-primary">-</strong>
    </div>
  </div>

  <section class="history-drawer-section">
    <h3>
      <span class="material-symbols-outlined">person</span>
      내 제출
    </h3>
    <div id="drawer-my-submissions"></div>
  </section>

  <section class="history-drawer-section">
    <h3>
      <span class="material-symbols-outlined">person_outline</span>
      상대 제출
    </h3>
    <div id="drawer-opp-submissions"></div>
  </section>
</aside>

<main class="max-w-[1280px] mx-auto px-5 py-10">
  <div class="mb-8">
    <h1 class="font-h1 text-h1 text-on-surface mb-1">기록</h1>
    <p class="font-body-sm text-body-sm text-secondary">나의 코드 배틀 전적을 확인하세요.</p>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
    <div class="stat-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center">
      <span class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">총 경기</span>
      <span id="stat-total" class="font-display text-h1 text-on-surface font-bold">0</span>
    </div>
    <div class="stat-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center">
      <span class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">승리</span>
      <span id="stat-win" class="stat-win font-display text-h1 font-bold">0</span>
    </div>
    <div class="stat-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center">
      <span class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">패배</span>
      <span id="stat-lose" class="stat-lose font-display text-h1 font-bold">0</span>
    </div>
    <div class="stat-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center">
      <span class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">승률</span>
      <span id="stat-rate" class="font-display text-h1 text-primary font-bold">0%</span>
    </div>
    <div class="stat-card bg-surface-container-lowest border border-outline-variant rounded-xl p-5 flex flex-col items-center col-span-2 md:col-span-1">
      <span class="font-label-md text-label-md text-secondary uppercase tracking-widest mb-2">평균 시간</span>
      <span id="stat-avg" class="font-display text-h1 text-on-surface font-bold">00:00</span>
    </div>
  </div>

  <div class="filter-panel bg-surface-container-lowest border border-outline-variant rounded-xl p-5 mb-6">
    <div class="flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-2">
        <button type="button" class="filter-tab active" data-filter="all">전체</button>
        <button type="button" class="filter-tab" data-filter="win">승리</button>
        <button type="button" class="filter-tab" data-filter="lose">패배</button>
      </div>

      <div class="w-px h-8 bg-outline-variant hidden md:block"></div>

      <select id="filter-problem" class="filter-input">
        <option value="">문제 전체</option>
        <option value="A+B">A+B</option>
        <option value="배열 합">배열 합</option>
        <option value="괄호 검사">괄호 검사</option>
        <option value="최단 경로">최단 경로</option>
        <option value="동적 프로그래밍">동적 프로그래밍</option>
      </select>

      <select id="filter-period" class="filter-input">
        <option value="">기간 전체</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
        <option value="90">최근 3개월</option>
      </select>

      <div class="flex items-center gap-2 flex-1 min-w-[180px]">
        <div class="relative flex-1">
          <span class="material-symbols-outlined search-icon absolute left-3 top-1/2 -translate-y-1/2 text-secondary">search</span>
          <input id="filter-search" type="text" placeholder="상대방 닉네임 검색" class="filter-input w-full pl-9"/>
        </div>
        <button id="btn-reset" type="button" class="filter-input text-secondary hover:text-primary hover:border-primary whitespace-nowrap">
          초기화
        </button>
      </div>
    </div>
  </div>

  <div class="records-table bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden mb-6">
    <table class="w-full">
      <thead>
        <tr class="table-head border-b border-outline-variant">
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">결과</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">경기 ID</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">문제</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">상대</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">소요 시간</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">제출 횟수</th>
          <th class="text-left px-5 py-3 font-label-md text-label-md text-secondary uppercase tracking-widest">진행일</th>
          <th class="px-5 py-3"></th>
        </tr>
      </thead>
      <tbody id="record-tbody"></tbody>
    </table>

    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-secondary">
      <span class="material-symbols-outlined empty-icon mb-3">inbox</span>
      <p class="font-body-md text-body-md">조건에 맞는 기록이 없습니다.</p>
    </div>
  </div>

  <div id="pagination" class="flex items-center justify-center gap-2"></div>
</main>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js?v=logout-home-2"></script>
<script src="/js/history.js?v=20260523-2"></script>
</body>
</html>
