<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/register-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<link href="/css/register.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">

  <div id="navbar-container"></div>

  <main class="auth-page min-h-[calc(100vh-64px)] flex items-center justify-center px-5 py-10">
    <div class="auth-card w-full max-w-sm px-8 py-10 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm">
      <a class="block text-center font-display text-h2 font-bold text-primary tracking-tight mb-8" href="/">
        CodeBattles
      </a>

      <h1 class="font-h2 text-h2 text-on-surface mb-6">회원가입</h1>

      <form id="register-form" novalidate>
        <div class="mb-1">
          <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="username">아이디</label>
          <input
            id="username"
            type="text"
            autocomplete="username"
            class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary transition-colors"
          />
        </div>
        <p class="field-help font-body-sm text-body-sm text-secondary mb-4">영문, 숫자 조합 <strong>4~20자</strong></p>

        <div class="mb-4">
          <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="nickname">닉네임</label>
          <input
            id="nickname"
            type="text"
            autocomplete="nickname"
            class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary transition-colors"
          />
        </div>

        <div class="mb-1">
          <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="password">비밀번호</label>
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary transition-colors"
          />
        </div>
        <p class="field-help font-body-sm text-body-sm text-secondary mb-4"><strong>8자</strong> 이상, 특수문자 포함</p>

        <div class="mb-6">
          <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="password-confirm">비밀번호 확인</label>
          <input
            id="password-confirm"
            type="password"
            autocomplete="new-password"
            class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary transition-colors"
          />
        </div>

        <button type="submit" class="register-submit w-full py-sm bg-primary text-on-primary font-body-md text-body-md font-bold rounded-lg hover:bg-primary-container active:scale-95 transition-all mb-5">
          회원가입
        </button>
      </form>

      <p class="text-center font-body-sm text-body-sm text-secondary">
        이미 계정이 있으신가요?
        <a href="/login" class="text-primary font-bold hover:underline">로그인</a>
      </p>
    </div>
  </main>

  <script src="/js/config.js?v=global-dark-3"></script>
  <script src="/js/api.js"></script>
  <script src="/js/navbar.js?v=admin-navbar-3"></script>
  <script src="/js/register.js"></script>
</body>
</html>
