<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/result-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="/css/result.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface">

<div id="navbar-container"></div>

<div class="result-wrap">
  <div class="result-banner">
    <div class="result-icon" aria-hidden="true">🎉</div>
    <div class="result-title result-win">승리</div>
    <div class="result-description">상대보다 먼저 정답을 맞혔습니다.</div>
  </div>

  <div class="card">
    <div class="card-title">배틀 정보</div>
    <div class="info-row">
      <span class="info-label">문제</span>
      <span class="info-value code-value">A+B</span>
    </div>
    <div class="info-row">
      <span class="info-label">상대</span>
      <span class="info-value strong-value">김건한</span>
    </div>
    <div class="info-row">
      <span class="info-label">종료 시간</span>
      <span class="info-value code-value text-primary">2026-05-10 14:30</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">제출 결과 비교</div>
    <div class="submit-grid">
      <div class="submit-box">
        <h6>내 제출 결과</h6>
        <div class="submit-row"><span class="submit-label">결과</span><span class="accepted-text code-value">Accepted</span></div>
        <div class="submit-row"><span class="submit-label">언어</span><span>Python</span></div>
        <div class="submit-row"><span class="submit-label">실행 시간</span><span class="code-value text-primary">0.002초</span></div>
        <div class="submit-row"><span class="submit-label">메모리</span><span class="code-value text-primary">3400 KB</span></div>
      </div>
      <div class="submit-box">
        <h6>상대 제출 결과</h6>
        <div class="submit-row"><span class="submit-label">결과</span><span class="wrong-text code-value">Wrong Answer</span></div>
        <div class="submit-row"><span class="submit-label">언어</span><span>Python</span></div>
        <div class="submit-row"><span class="submit-label">실행 시간</span><span class="code-value muted-code">0.005초</span></div>
        <div class="submit-row"><span class="submit-label">메모리</span><span class="code-value muted-code">3500 KB</span></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">전적 변화</div>
    <div class="record-change">
      <span>이전: <span class="code-value strong-value"><span class="accepted-text">3승</span> <span class="wrong-text">2패</span></span></span>
      <span class="change-arrow">→</span>
      <span>현재: <span class="code-value strong-value"><span class="accepted-text">4승</span> <span class="wrong-text">2패</span></span></span>
    </div>
  </div>

  <button id="btn-main" type="button" class="main-button block w-full text-center px-md py-sm border border-outline-variant text-secondary rounded-lg font-body-md hover:border-primary hover:text-primary transition-all">
    메인으로 돌아가기
  </button>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/navbar.js"></script>
<script src="/js/result.js"></script>
</body>
</html>
