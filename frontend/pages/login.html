<!DOCTYPE html>
<html class="light" lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="/js/login-tailwind.config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<link href="/css/style.css" rel="stylesheet"/>
<link href="/css/login.css" rel="stylesheet"/>
</head>
<body class="bg-surface font-body-md text-on-surface min-h-screen">

  <div id="navbar-container"></div>

  <main class="auth-page min-h-[calc(100vh-64px)] flex items-center justify-center px-5 py-10">
    <div class="auth-card w-full max-w-sm px-8 py-10 bg-surface-container-lowest border border-outline-variant rounded-xl shadow-sm">
      <a class="block text-center font-display text-h2 font-bold text-primary tracking-tight mb-8" href="/">
        CodeBattles
      </a>

      <h1 class="font-h2 text-h2 text-on-surface mb-6">로그인</h1>

      <div class="mb-4">
        <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="username">아이디</label>
        <input
          id="username"
          type="text"
          placeholder=""
          class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface placeholder:text-secondary focus:outline-none focus:border-primary transition-colors"
        />
      </div>

      <div class="mb-6">
        <label class="block font-body-sm text-body-sm text-on-surface-variant mb-1" for="password">비밀번호</label>
        <input
          id="password"
          type="password"
          placeholder=""
          class="w-full px-md py-sm border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface bg-surface placeholder:text-secondary focus:outline-none focus:border-primary transition-colors"
        />
      </div>

      <button id="btn-login" type="button" class="w-full py-sm bg-primary text-on-primary font-body-md text-body-md font-bold rounded-lg hover:bg-primary-container active:scale-95 transition-all mb-5">
        로그인
      </button>

      <p class="text-center font-body-sm text-body-sm text-secondary">
        계정이 없으신가요?
        <a href="/register" class="text-primary font-bold hover:underline">회원가입</a>
      </p>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
