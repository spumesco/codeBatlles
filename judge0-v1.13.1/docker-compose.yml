# ────────────────────────────────────────────────────────────
# CodeBattles — 로컬 전체 스택 (judge0-v1.13.1 폴더 내부 실행용)
#
# 구성:
#   - mysql          : 백엔드 DB
#   - judge0-db      : Judge0 전용 PostgreSQL
#   - judge0-redis   : Judge0 전용 Redis
#   - judge0         : Judge0 API 서버
#   - judge0-workers : Judge0 채점 워커 (privileged 필요)
#   - backend        : FastAPI 백엔드 + 프론트엔드 정적 서빙
#
# 사용 (이 파일이 있는 디렉토리에서 실행):
#   전체 스택:
#     cd judge0-v1.13.1
#     docker compose up -d --build
#
#   Judge0 빼고 백엔드만(가벼움):
#     cd judge0-v1.13.1
#     docker compose up -d --build mysql backend
#     → backend 는 LocalExecutor 폴백으로 채점 (Python/C/C++/Java)
#
#   접속:
#     http://localhost:8000        — CodeBattles
#     http://localhost:2358/about  — Judge0 헬스체크
#
# 경로 메모:
#   compose 파일이 프로젝트 루트의 한 단계 아래(judge0-v1.13.1/)에 있어서
#   backend 빌드 컨텍스트는 '..' (루트) 로 잡는다. judge0.conf 는 같은 폴더에 둠.
#
# 주의:
#   - 'judge0-workers' 는 privileged: true 가 필수 (isolate Linux 샌드박싱).
#     Docker Desktop / Linux Docker 에서만 동작. Render 등 PaaS 에선 미지원.
#     클라우드 배포는 backend Dockerfile 단독 + 로컬 폴백 채점 사용.
# ────────────────────────────────────────────────────────────

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"

services:
  # ── 백엔드 DB ───────────────────────────────────────────
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: codebattles
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    <<: *default-logging

  # ── Judge0 — PostgreSQL ─────────────────────────────────
  judge0-db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data/
    # judge0 server/workers 가 host=db 로 접근하므로 alias 추가
    networks:
      default:
        aliases: [db]
    restart: unless-stopped
    <<: *default-logging

  # ── Judge0 — Redis ─────────────────────────────────────
  judge0-redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    networks:
      default:
        aliases: [redis]
    restart: unless-stopped
    <<: *default-logging

  # ── Judge0 — API 서버 ──────────────────────────────────
  judge0:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped
    <<: *default-logging

  # ── Judge0 — 채점 워커 (privileged 필수) ───────────────
  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0
    restart: unless-stopped
    <<: *default-logging

  # ── CodeBattles 백엔드 ─────────────────────────────────
  backend:
    build:
      # compose 파일이 한 단계 아래 있으니, 빌드 컨텍스트는 프로젝트 루트.
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      # 백엔드 DB
      DATABASE_URL: mysql+aiomysql://root:password@mysql:3306/codebattles
      # Judge0 — 같은 compose 네트워크 안에서 호출
      JUDGE0_URL: http://judge0:2358
      # 폴백 활성 (기본 1) — Judge0 가 죽어도 자동으로 LocalExecutor 사용
      USE_LOCAL_FALLBACK: "1"
      # 시크릿 (로컬용 더미 — 운영에선 반드시 교체)
      SECRET_KEY: local-dev-change-me
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    <<: *default-logging

volumes:
  mysql_data:
  judge0_pg_data:
